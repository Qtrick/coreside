# Explicit denies for high-risk commands (defense in depth for tool windows).
#
# IMPORTANT (Tauri 2.11): `commands.deny` is applied globally for the local
# origin — window/webview patterns on the capability are NOT consulted in
# `RuntimeAuthority::resolve_access` when a deny entry exists. Linking this
# permission from `tool-window` therefore also blocked `send_message` (and
# peers) on the **main** window (Journey 12 failure 2026-08-04).
#
# Tool isolation relies on allowlist-only `coreside-tool-scoped` instead.
# Keep this file as a documented deny catalog; do not re-attach until Tauri
# scopes denies by window the same way it scopes allows.
#
# Regression guard: `scripts/coreside-doctor.mjs` check
# `capabilities.tool_window_no_global_deny` fails if this identifier appears
# in `src-tauri/capabilities/tool-window.json`.
"$schema" = "../gen/schemas/schema.json"

[[permission]]
identifier = "coreside-tool-deny-sensitive"
description = "Deny catalog for tool windows — NOT linked in tool-window capability (Tauri global-deny hazard). Isolation = coreside-tool-scoped allowlist."
commands.deny = [
  "clear_conversations",
  "clear_hosted_auth_session",
  "clear_search_history_cmd",
  "clear_tools",
  "configure_exa_connection",
  "configure_search_connection",
  "create_profile_backup",
  "delete_exa_connection",
  "delete_provider_connection",
  "delete_search_connection",
  "get_hosted_auth_status",
  "import_media_asset_cmd",
  "kernel_clear_policy_override",
  "kernel_export_package",
  "kernel_export_package_bytes",
  "kernel_grant_permission",
  "kernel_import_package",
  "kernel_set_policy_override",
  "list_managed_backups",
  "preview_restore_backup",
  "provider_key_hints",
  "restore_profile_backup",
  "retry_open_database",
  "send_message",
  "set_active_provider_connection",
  "set_exa_budget",
  "set_setting",
  "set_workspace_appearance",
  "cancel_chat_attachment",
  "get_chat_attachment_src",
  "run_attachment_gc",
  "stage_chat_attachment",
  "store_hosted_auth_session",
  "subscribe_conversation_queue",
  # subscribe_conversation_sync is intentionally allowlisted in coreside-tool-scoped
  # so tool windows can receive Sync without the global agent-turn bus.
  "test_provider_connection",
  "upsert_provider_connection"
]
