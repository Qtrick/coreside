[package]
name = "coreside"
version = "0.1.0"
description = "Coreside — AI-native personal software environment"
authors = ["Coreside"]
edition = "2021"
rust-version = "1.77"

# Capitalized binary so macOS Dock tooltip shows "Coreside" during `tauri dev`
# (Cargo package names must stay lowercase; the Dock uses the executable basename).
[[bin]]
name = "Coreside"
path = "src/main.rs"

[lib]
name = "coreside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mp4parse = "0.17"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem"] }
embed_plist = "1.2"

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Desktop WebDriver E2E only. Never enable in production / `tauri build` defaults.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio]
version = "1.2.0"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1.2.0"
optional = true
