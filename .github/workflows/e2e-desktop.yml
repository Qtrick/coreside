name: Desktop E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-macos:
    name: Desktop E2E (macOS)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Doctor (E2E production gates)
        run: npm run doctor -- --json

      - name: Build E2E binary
        run: npm run e2e:build

      - name: Run desktop E2E
        run: npm run e2e
        # Real fail preferred. continue-on-error is intentionally NOT set.
        # macOS runners provide a GUI session for the embedded WebDriver provider.

      - name: Publish E2E results to step summary
        if: failure()
        run: |
          if [ -f reports/e2e-results.json ]; then
            {
              echo "## Desktop E2E results (reports/e2e-results.json)"
              echo ""
              echo '```json'
              cat reports/e2e-results.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reports/e2e-results.json was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-diagnostics
          path: |
            reports/e2e-results.json
            reports/*-results.json
            logs/
            e2e/.artifacts/
          if-no-files-found: warn
          retention-days: 14
