name: Packaging

# Build native artifacts without publishing. No production secrets required.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/assert-production-excludes-e2e.mjs"
      - "scripts/scan-packaged-contents.mjs"
      - ".github/workflows/packaging.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/assert-production-excludes-e2e.mjs"
      - "scripts/scan-packaged-contents.mjs"
      - ".github/workflows/packaging.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Assert production excludes E2E feature
        run: node scripts/assert-production-excludes-e2e.mjs

      - name: Build packaged app (unsigned / ad-hoc where required)
        # Linux: skip AppImage. Tauri's AppImage path downloads AppRun from
        # tauri-apps/binary-releases (apprun-old), which has returned HTTP 500
        # on CI and fails the whole Package job. deb (+ rpm) still prove Linux
        # packaging without that external binary.
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx tauri build --bundles deb,rpm
          else
            npm run build
          fi
        env:
          # Avoid requiring Apple Developer signing secrets on PR builds.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Scan packaged contents for forbidden artifacts
        shell: bash
        run: node scripts/scan-packaged-contents.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreside-${{ matrix.platform }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
